version: '3.8'

services:
  secure-file-transfer:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./encrypted_files:/app/encrypted_files
      - ./face_encodings:/app/face_encodings
      - ./.env:/app/.env
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - secure-file-transfer
    restart: unless-stopped

volumes:
  uploads:
  encrypted_files:
  face_encodings:
